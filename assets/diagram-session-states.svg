<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="sessTitle sessDesc" class="dg">
  <title id="sessTitle" data-en="Session states" data-pt="Estados da sessão">Session states</title>
  <desc id="sessDesc" data-en="A launch opens a new active session. An active session can be compacted, resumed, or forked; a fork leaves a second session running in parallel." data-pt="Uma abertura cria uma sessão ativa nova. Uma sessão ativa pode ser compactada, retomada ou bifurcada; a bifurcação deixa uma segunda sessão correndo em paralelo.">A launch opens a new active session. An active session can be compacted, resumed, or forked; a fork leaves a second session running in parallel.</desc>
  <style>
    .dg{--bg:#000;--bg-2:#0d0d0d;--fg:#fff;--muted:#787878;--line:rgba(255,255,255,.18);--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .dg .bg{fill:var(--bg)}
    .dg .ln{fill:none;stroke:var(--fg);stroke-opacity:.35;stroke-width:1}
    .dg .box{fill:var(--bg);stroke:var(--fg);stroke-width:1}
    .dg .box-quiet{fill:var(--bg-2);stroke:var(--fg);stroke-opacity:.55;stroke-width:1}
    .dg text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:500}
    .dg .sub{fill:var(--muted);font-size:13px;font-weight:400}
  </style>
  <rect class="bg" width="900" height="300"/>
  <g class="ln">
    <line x1="220" y1="152" x2="300" y2="152"/>
    <line x1="470" y1="152" x2="560" y2="152"/>
    <line x1="385" y1="124" x2="385" y2="78"/>
    <path d="M470 138 H520 V52 H560"/>
    <path d="M730 52 H800 V248 H730"/>
  </g>
  <rect class="box" x="50" y="124" width="170" height="56" rx="2"/>
  <rect class="box" x="300" y="124" width="170" height="56" rx="2"/>
  <rect class="box-quiet" x="300" y="26" width="170" height="52" rx="2"/>
  <rect class="box" x="560" y="124" width="170" height="56" rx="2"/>
  <rect class="box" x="560" y="26" width="170" height="52" rx="2"/>
  <rect class="box-quiet" x="560" y="222" width="170" height="52" rx="2"/>
  <text x="135" y="157" text-anchor="middle" data-en="launch" data-pt="abertura">launch</text>
  <text x="385" y="157" text-anchor="middle" data-en="active" data-pt="ativa">active</text>
  <text x="385" y="57" text-anchor="middle" data-en="compacted" data-pt="compactada">compacted</text>
  <text x="645" y="157" text-anchor="middle" data-en="resume" data-pt="retomada">resume</text>
  <text x="645" y="57" text-anchor="middle" data-en="fork" data-pt="bifurcação">fork</text>
  <text x="645" y="253" text-anchor="middle" data-en="new session" data-pt="nova sessão">new session</text>
  <text class="sub" x="800" y="222" text-anchor="end" data-en="parallel" data-pt="paralela">parallel</text>
</svg>