<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="promoTitle promoDesc" class="dg">
  <title id="promoTitle" data-en="Promotion decision" data-pt="Decisão de promoção">Promotion decision</title>
  <desc id="promoDesc" data-en="Verify feeds the gate. A green gate fills and promotes; a red gate stays hollow and follows a dashed line to revert, which returns to generate." data-pt="O verificar alimenta o gate. Um gate verde preenche e promove; um gate vermelho fica oco e segue uma linha tracejada até reverter, o que volta a gerar.">Verify feeds the gate. A green gate fills and promotes; a red gate stays hollow and follows a dashed line to revert, which returns to generate.</desc>
  <style>
    .dg{--bg:#000;--fg:#fff;--muted:#787878;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .dg .bg{fill:var(--bg)}
    .dg .ln{fill:none;stroke:var(--fg);stroke-opacity:.35;stroke-width:1}
    .dg .dash{fill:none;stroke:var(--fg);stroke-opacity:.55;stroke-width:1;stroke-dasharray:4 4}
    .dg .box{fill:var(--bg);stroke:var(--fg);stroke-width:1}
    .dg .gate{fill:var(--fg)}
    .dg .gate-off{fill:var(--bg);stroke:var(--fg);stroke-width:1.5}
    .dg text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:500}
    .dg .sub{fill:var(--muted);font-size:13px;font-weight:400}
  </style>
  <rect class="bg" width="900" height="340"/>
  <g class="ln">
    <line x1="200" y1="175" x2="290" y2="175"/>
    <line x1="450" y1="175" x2="520" y2="175"/>
    <line x1="520" y1="105" x2="520" y2="245"/>
    <line x1="520" y1="105" x2="586" y2="105"/>
    <line x1="520" y1="245" x2="586" y2="245"/>
    <line x1="614" y1="105" x2="700" y2="105"/>
    <line x1="780" y1="273" x2="780" y2="328"/>
    <line x1="780" y1="328" x2="120" y2="328"/>
    <line x1="120" y1="328" x2="120" y2="205"/>
  </g>
  <path class="dash" d="M614 245 H700"/>
  <rect class="box" x="40" y="145" width="160" height="60" rx="2"/>
  <rect class="box" x="290" y="145" width="160" height="60" rx="2"/>
  <rect class="box" x="700" y="77" width="160" height="56" rx="2"/>
  <rect class="box" x="700" y="217" width="160" height="56" rx="2"/>
  <circle class="gate" cx="600" cy="105" r="14"/>
  <circle class="gate-off" cx="600" cy="245" r="14"/>
  <text x="120" y="180" text-anchor="middle" data-en="generate" data-pt="gerar">generate</text>
  <text x="370" y="180" text-anchor="middle" data-en="verify" data-pt="verificar">verify</text>
  <text x="600" y="64" text-anchor="middle" data-en="gate" data-pt="gate">gate</text>
  <text class="sub" x="600" y="82" text-anchor="middle" data-en="green" data-pt="verde">green</text>
  <text x="600" y="284" text-anchor="middle" data-en="gate" data-pt="gate">gate</text>
  <text class="sub" x="600" y="302" text-anchor="middle" data-en="red" data-pt="vermelho">red</text>
  <text x="780" y="110" text-anchor="middle" data-en="promote" data-pt="promover">promote</text>
  <text x="780" y="250" text-anchor="middle" data-en="revert" data-pt="reverter">revert</text>
  <text class="sub" x="450" y="322" text-anchor="middle" data-en="revalidate" data-pt="revalidar">revalidate</text>
</svg>