<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-labelledby="ctxTitle ctxDesc" class="dg">
  <title id="ctxTitle" data-en="Context budget" data-pt="Orçamento de contexto">Context budget</title>
  <desc id="ctxDesc" data-en="A horizontal bar of 1500 tokens. The first 499 tokens are the SelfEvoPI overhead; the rest is free, with skills and MCP loaded on demand." data-pt="Uma barra horizontal de 1500 tokens. Os primeiros 499 tokens são o overhead do SelfEvoPI; o resto fica livre, com skills e MCP carregados sob demanda.">A horizontal bar of 1500 tokens. The first 499 tokens are the SelfEvoPI overhead; the rest is free, with skills and MCP loaded on demand.</desc>
  <style>
    .dg{--bg:#000;--bg-2:#0d0d0d;--fg:#fff;--muted:#787878;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .dg .bg{fill:var(--bg)}
    .dg .ln{fill:none;stroke:var(--fg);stroke-opacity:.35;stroke-width:1}
    .dg .bar{fill:var(--bg-2);stroke:var(--fg);stroke-width:1}
    .dg .seg{fill:var(--fg)}
    .dg text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:500}
    .dg .sub{fill:var(--muted);font-size:13px;font-weight:400}
    .dg .inv{fill:var(--bg)}
  </style>
  <rect class="bg" width="900" height="220"/>
  <text x="189" y="54" text-anchor="middle" data-en="SelfEvoPI overhead" data-pt="Overhead do SelfEvoPI">SelfEvoPI overhead</text>
  <text x="580" y="54" text-anchor="middle" data-en="skills/MCP on-demand" data-pt="skills/MCP sob demanda">skills/MCP on-demand</text>
  <g class="ln">
    <line x1="189" y1="62" x2="189" y2="88"/>
    <line x1="580" y1="62" x2="580" y2="88"/>
    <line x1="60" y1="144" x2="60" y2="154"/>
    <line x1="319" y1="144" x2="319" y2="154"/>
    <line x1="840" y1="144" x2="840" y2="154"/>
  </g>
  <rect class="bar" x="60" y="88" width="780" height="56"/>
  <rect class="seg" x="60" y="88" width="259" height="56"/>
  <text class="inv" x="189" y="122" text-anchor="middle" data-en="499 tokens" data-pt="499 tokens">499 tokens</text>
  <text class="sub" x="580" y="122" text-anchor="middle" data-en="1001 tokens free" data-pt="1001 tokens livres">1001 tokens free</text>
  <text class="sub" x="60" y="176" data-en="0" data-pt="0">0</text>
  <text class="sub" x="319" y="176" text-anchor="middle" data-en="499" data-pt="499">499</text>
  <text class="sub" x="840" y="176" text-anchor="end" data-en="1500 tokens" data-pt="1500 tokens">1500 tokens</text>
</svg>