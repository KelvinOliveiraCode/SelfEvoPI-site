<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="memTitle memDesc" class="dg">
  <title id="memTitle" data-en="How memory moves" data-pt="Como a memória se move">How memory moves</title>
  <desc id="memDesc" data-en="Facts are redacted before they are stored. They start in session memory, move to project memory when they survive, and reach skills only when evidence supports them. Each level is pruned by rules." data-pt="Os fatos são redigidos antes de serem gravados. Começam na memória de sessão, passam à memória de projeto quando sobrevivem e só chegam às skills quando há evidência. Cada nível é podado por regras.">Facts are redacted before they are stored. They start in session memory, move to project memory when they survive, and reach skills only when evidence supports them. Each level is pruned by rules.</desc>
  <style>
    .dg{--bg:#000;--fg:#fff;--muted:#787878;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .dg .bg{fill:var(--bg)}
    .dg .ln{fill:none;stroke:var(--fg);stroke-opacity:.4;stroke-width:1}
    .dg .box{fill:var(--bg);stroke:var(--fg);stroke-width:1}
    .dg .filled{fill:var(--fg)}
    .dg text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:500}
    .dg .sub{fill:var(--muted);font-size:12px;font-weight:400}
  </style>
  <rect class="bg" width="900" height="320"/>
  <g class="ln">
    <line x1="170" y1="160" x2="290" y2="160"/>
    <line x1="450" y1="160" x2="570" y2="160"/>
    <line x1="730" y1="160" x2="830" y2="160"/>
    <line x1="290" y1="200" x2="290" y2="248"/>
    <line x1="570" y1="200" x2="570" y2="248"/>
  </g>
  <rect class="box" x="60" y="130" width="110" height="60" rx="2"/>
  <rect class="box" x="290" y="126" width="160" height="68" rx="2"/>
  <rect class="box" x="570" y="126" width="160" height="68" rx="2"/>
  <circle class="filled" cx="880" cy="160" r="14"/>
  <text class="sub" x="115" y="104" text-anchor="middle" data-en="redact on entry" data-pt="redigir na entrada">redact on entry</text>
  <text x="115" y="166" text-anchor="middle" data-en="fact" data-pt="fato">fact</text>
  <text x="370" y="154" text-anchor="middle" data-en="session" data-pt="sessão">session</text>
  <text x="370" y="178" text-anchor="middle" data-en="one turn" data-pt="um turno">one turn</text>
  <text x="650" y="154" text-anchor="middle" data-en="project" data-pt="projeto">project</text>
  <text x="650" y="178" text-anchor="middle" data-en="survives restarts" data-pt="sobrevive a reinícios">survives restarts</text>
  <text x="800" y="136" text-anchor="middle" data-en="skills" data-pt="skills">skills</text>
  <text class="sub" x="290" y="270" text-anchor="middle" data-en="prune by rule" data-pt="poda por regra">prune by rule</text>
  <text class="sub" x="570" y="270" text-anchor="middle" data-en="prune by evidence" data-pt="poda por evidência">prune by evidence</text>
  <text class="sub" x="450" y="308" text-anchor="middle" data-en="three levels, append only, 400 token ceiling per turn" data-pt="três níveis, append only, teto de 400 tokens por turno">three levels, append only, 400 token ceiling per turn</text>
</svg>
