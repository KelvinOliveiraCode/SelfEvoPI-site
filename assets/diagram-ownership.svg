<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="ownTitle ownDesc" class="dg">
  <title id="ownTitle" data-en="Where the harness draws the line" data-pt="Onde o harness traça a linha">Where the harness draws the line</title>
  <desc id="ownDesc" data-en="The engine supplies the model and tools. The harness decides what enters the prompt, how long a turn runs, how errors are handled and when a change is promoted." data-pt="O motor fornece o modelo e as ferramentas. O harness decide o que entra no prompt, quanto tempo dura um turno, como os erros são tratados e quando uma mudança é promovida.">The engine supplies the model and tools. The harness decides what enters the prompt, how long a turn runs, how errors are handled and when a change is promoted.</desc>
  <style>
    .dg{--bg:#000;--fg:#fff;--muted:#787878;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .dg .bg{fill:var(--bg)}
    .dg .ln{fill:none;stroke:var(--fg);stroke-opacity:.35;stroke-width:1}
    .dg .box{fill:var(--bg);stroke:var(--fg);stroke-width:1}
    .dg text{fill:var(--fg);font-family:var(--font);font-size:15px;font-weight:500}
    .dg .sub{fill:var(--muted);font-size:13px;font-weight:400}
  </style>
  <rect class="bg" width="900" height="320"/>
  <g class="ln">
    <line x1="450" y1="44" x2="450" y2="288"/>
    <line x1="190" y1="160" x2="332" y2="160"/>
    <line x1="568" y1="96" x2="640" y2="96"/>
    <line x1="568" y1="152" x2="640" y2="152"/>
    <line x1="568" y1="208" x2="640" y2="208"/>
    <line x1="568" y1="264" x2="640" y2="264"/>
  </g>
  <rect class="box" x="40" y="120" width="190" height="80" rx="2"/>
  <rect class="box" x="640" y="70" width="220" height="52" rx="2"/>
  <rect class="box" x="640" y="126" width="220" height="52" rx="2"/>
  <rect class="box" x="640" y="182" width="220" height="52" rx="2"/>
  <rect class="box" x="640" y="238" width="220" height="52" rx="2"/>
  <text x="135" y="155" text-anchor="middle" data-en="engine" data-pt="motor">engine</text>
  <text class="sub" x="135" y="178" text-anchor="middle" data-en="model and tools" data-pt="modelo e ferramentas">model and tools</text>
  <text class="sub" x="450" y="32" text-anchor="middle" data-en="the boundary is a design choice" data-pt="a fronteira é uma escolha de projeto">the boundary is a design choice</text>
  <text x="750" y="102" text-anchor="middle" data-en="context" data-pt="contexto">context</text>
  <text x="750" y="158" text-anchor="middle" data-en="turn length" data-pt="duração do turno">turn length</text>
  <text x="750" y="214" text-anchor="middle" data-en="errors" data-pt="erros">errors</text>
  <text x="750" y="270" text-anchor="middle" data-en="promotion" data-pt="promoção">promotion</text>
</svg>
